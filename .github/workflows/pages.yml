name: Build and publish Flight Lookup
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: flight-lookup-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vradarserver/standing-data
          path: upstream
          sparse-checkout: |
            airlines/schema-01
            airports/schema-01
            routes/schema-01
          persist-credentials: false
      - run: python3 scripts/build_db.py upstream site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
